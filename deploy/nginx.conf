# OsonBiznes - Nginx Konfiguratsiyasi
# Ishga tushirish:
# 1. sudo ln -s /path/to/nginx.conf /etc/nginx/sites-available/osonbiznes
# 2. sudo ln -s /etc/nginx/sites-available/osonbiznes /etc/nginx/sites-enabled/
# 3. sudo nginx -t
# 4. sudo systemctl reload nginx

# Rate limit zonasi http kontekstida bo'lishi SHART.
# (sites-available/ fayllari nginx.conf ichidagi http{} blokiga include qilinadi)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name osonbiznes.uz www.osonbiznes.uz;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name osonbiznes.uz www.osonbiznes.uz;

    # SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/osonbiznes.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/osonbiznes.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend (React build)
    root /var/www/osonbiznes/frontend/dist;
    index index.html;

    # Static files caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy (rate limit shu yerda)
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Yuklangan rasmlar (backend /uploads)
    location /uploads/ {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/octet-stream;

    # Logging
    access_log /var/log/nginx/osonbiznes_access.log;
    error_log /var/log/nginx/osonbiznes_error.log;
}
