# OsonBiznes — Render.com Blueprint (backend + frontend + telegram bot)
# Ma'lumotlar bazasi: MongoDB Atlas (bepul tier) — MONGODB_URI ni dashboard'da kiriting.
# Deploy: Render → New → Blueprint → shu repo'ni tanlang.

services:
  # 1) Backend API (Node/Express)
  - type: web
    name: osonbiznes-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false            # MongoDB Atlas connection string (dashboard'da kiriting)
      - key: JWT_SECRET
        generateValue: true    # Render avtomatik kuchli kalit yaratadi
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: FRONTEND_URL
        sync: false            # frontend URL, masalan: https://osonbiznes-web.onrender.com
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: ADMIN_EMAIL
        sync: false            # birinchi admin (faqat baza bo'sh bo'lsa yaratiladi)
      - key: ADMIN_PASSWORD
        sync: false            # kamida 12 belgi
      - key: PAYMENT_CARD_NUMBER
        sync: false            # obuna puli tushadigan karta
      - key: PAYMENT_CARD_HOLDER
        sync: false
      - key: PAYMENT_CARD_BANK
        sync: false
      - key: AGENT_API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # 2) Frontend (React static site)
  - type: web
    name: osonbiznes-web
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false            # https://osonbiznes-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3) Telegram bot (Python worker)
  - type: worker
    name: osonbiznes-bot
    runtime: python
    rootDir: telegram-bot
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: API_URL
        sync: false            # https://osonbiznes-api.onrender.com/api
