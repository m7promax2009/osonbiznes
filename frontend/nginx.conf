# Frontend konteyneri uchun Nginx (conf.d ichida — http konteksti bilan).
# TLS/HTTPS bu konteynerda emas — tashqi reverse-proxy (Caddy/host nginx/Cloudflare)
# yoki deploy/nginx.conf (VPS + certbot) orqali termalanadi.

# Rate limit zonasi http kontekstida bo'lishi SHART (conf.d fayli http{} ichida include qilinadi)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Statik fayllar keshi
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — compose'dagi "backend" servisiga
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Yuklangan rasmlar (backend /uploads)
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
}
